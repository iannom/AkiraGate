name: akiragate

services:
  akiragate:
    image: akiragate:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      AKIRAGATE_DATA_DIR: /data
      AKIRAGATE_CONFIG: /data/config.json
      AKIRAGATE_WEB_ROOT: /app/frontend/dist
      AKIRAGATE_WEB_HOST: 0.0.0.0
      AKIRAGATE_WEB_PORT: ${AKIRAGATE_WEB_PORT:-8787}
      AKIRAGATE_SECRET_PATH: ${AKIRAGATE_SECRET_PATH:-}
      AKIRAGATE_ADMIN_USERNAME: ${AKIRAGATE_ADMIN_USERNAME:-admin}
      AKIRAGATE_ADMIN_PASSWORD: ${AKIRAGATE_ADMIN_PASSWORD:-}
      AKIRAGATE_API_TOKEN: ${AKIRAGATE_API_TOKEN:-}
      AKIRAGATE_OPENVPN_CONFIG: ${AKIRAGATE_OPENVPN_CONFIG:-}
      AKIRAGATE_OPENVPN_AUTH: ${AKIRAGATE_OPENVPN_AUTH:-/data/vpngate_auth.txt}
      AKIRAGATE_AUTO_CONNECT: ${AKIRAGATE_AUTO_CONNECT:-false}
      AKIRAGATE_REFRESH_SECONDS: ${AKIRAGATE_REFRESH_SECONDS:-960}
      AKIRAGATE_PROXY_CACHE_TTL_SECONDS: ${AKIRAGATE_PROXY_CACHE_TTL_SECONDS:-3600}
      AKIRAGATE_PROXY_LEASE_SECONDS: ${AKIRAGATE_PROXY_LEASE_SECONDS:-3600}
      AKIRAGATE_PROXY_LISTEN_HOST: ${AKIRAGATE_PROXY_LISTEN_HOST:-0.0.0.0}
      AKIRAGATE_ROUTING_MODE: ${AKIRAGATE_ROUTING_MODE:-auto}
      AKIRAGATE_FORCE_COUNTRY: ${AKIRAGATE_FORCE_COUNTRY:-}
      AKIRAGATE_FIXED_NODE_ID: ${AKIRAGATE_FIXED_NODE_ID:-}
      AKIRAGATE_SOCKS_NAME: ${AKIRAGATE_SOCKS_NAME:-local}
      AKIRAGATE_SOCKS_HOST: 0.0.0.0
      AKIRAGATE_SOCKS_PORT: ${AKIRAGATE_SOCKS_PORT:-7928}
      AKIRAGATE_SOCKS_USERNAME: ${AKIRAGATE_SOCKS_USERNAME:-proxy}
      AKIRAGATE_SOCKS_PASSWORD: ${AKIRAGATE_SOCKS_PASSWORD:-}
    ports:
      - "${AKIRAGATE_WEB_BIND:-0.0.0.0}:${AKIRAGATE_WEB_PORT:-8787}:${AKIRAGATE_WEB_PORT:-8787}"
      - "${AKIRAGATE_SOCKS_BIND:-127.0.0.1}:${AKIRAGATE_SOCKS_PORT:-7928}:${AKIRAGATE_SOCKS_PORT:-7928}"
    volumes:
      - akiragate-data:/data
    stop_grace_period: 30s

volumes:
  akiragate-data:
